services:
  - type: web
    name: migmaster-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIG_WS_URL
        value: wss://developer.mig33.id/developer/ws
      - key: DASHBOARD_TOKEN
        sync: false
